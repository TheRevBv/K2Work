info:
  name: "Sin token"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/importador/{{layout}}"
  body:
    type: multipart-form
    data:
      - name: "file"
        type: file
        value:
          - "archivos/01-avasa-ok.xlsx"
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 401", () => expect(res.getStatus() === 401).to.be.true);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
