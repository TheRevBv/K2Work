info:
  name: "Archivo mayor a 5 MB"
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/importador/{{layout}}"
  body:
    type: multipart-form
    data:
      - name: "file"
        type: file
        value:
          - "archivos/06-grande.xlsx"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 413", () => expect(res.getStatus() === 413).to.be.true);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
