info:
  name: "Sin archivo"
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/importador/{{layout}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 400", () => expect(res.getStatus() === 400).to.be.true);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
