info:
  name: "Layouts disponibles"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/importador/layouts"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 200", () => expect(res.getStatus() === 200).to.be.true);
        test("res.getBody().data.some(l => l.key === 'avasa_contratos')", () => expect(res.getBody().data.some(l => l.key === 'avasa_contratos')).to.be.true);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
