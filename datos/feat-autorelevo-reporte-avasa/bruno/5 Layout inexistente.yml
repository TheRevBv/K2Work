info:
  name: "Layout inexistente"
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/importador/no_existe"
  body:
    type: multipart-form
    data:
      - name: "file"
        type: file
        value:
          - "archivos/01-avasa-ok.xlsx"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 404", () => expect(res.getStatus() === 404).to.be.true);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
