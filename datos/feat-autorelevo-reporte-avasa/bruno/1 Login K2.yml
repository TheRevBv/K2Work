info:
  name: Login K2
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrlDev}}/api/auth/token"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{user}}",
        "password": "{{pass}}"
      }

runtime:
  variables:
    - name: baseUrlDev
      value: https://micrositio-autorelevo-web-dot-morfeo-dev-321917.ue.r.appspot.com
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (res.getStatus() >= 200 && res.getStatus() < 300 && body && body.token) {
          bru.setVar("k2_token", body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
