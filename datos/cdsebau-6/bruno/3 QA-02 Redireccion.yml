info:
  name: "QA-02 Redireccion"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/s/{{code}}"
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 302", () => expect(res.getStatus() === 302).to.be.true);
        test("res.getHeader('location') === 'https://www.google.com/maps?q=19.4326,-99.1332'", () => expect(res.getHeader('location') === 'https://www.google.com/maps?q=19.4326,-99.1332').to.be.true);

docs:
  content: |-
    Esperado: 302 con Location = targetUrl.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
