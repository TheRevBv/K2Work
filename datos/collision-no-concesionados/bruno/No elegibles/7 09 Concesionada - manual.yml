info:
  name: "09 Concesionada - manual"
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v2/wa/sinister/create_folio"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "flow_type": "concesionada",
        "codigo_siniestro": "{{siniestroAjustador}}",
        "telefono_contacto_wa": "5512345678",
        "nombre_contacto": "QA Colision",
        "ubicacion_gps": "{{gpsOrigen}}",
        "ubicacion_destino_gps": "{{gpsDestino}}",
        "transfer_type": "Ciudad",
        "car_type": "Equipo Ligero",
        "car_state": "Daño parcial",
        "crane_was_requested_by_authority": false,
        "destination_type": "Taller",
        "vehicle_has_load": false,
        "crane_in_site": false,
        "permisionario": null,
        "permisionario_name": "Grúas QA",
        "tires_rotate": true,
        "neutral_working": true,
        "comments": "QA colisión concesionada"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 201", () => expect(res.getStatus() === 201).to.be.true);

docs:
  content: |-
    `provider_type=Concesionado` → `requires_manual_assignment` y `trigger=true`. Esperado: 201 sin envío a Qonect. Usa el mismo siniestro que 01: córrelo con otro siniestro Ajustador libre.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
