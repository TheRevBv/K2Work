info:
  name: "Re-autorizar (sin segundo correo)"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/boleta-informativa/auto-relevo/tickets/{{ticket_id}}/autorizacion"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "aprobado": true,
        "comentario": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 400", () => expect(res.getStatus() === 400).to.be.true);

docs:
  content: |-
    Esperado: 400 porque ya no está en estatus autorizable; no llega otro correo.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
