info:
  name: "Sin token"
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/boleta-informativa/auto-relevo/tickets/{{ticket_id}}/autorizacion"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "aprobado": true,
        "comentario": ""
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 401", () => expect(res.getStatus() === 401).to.be.true);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
