info:
  name: "Cerrar folio B"
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/api/v1/boleta-informativa/auto-relevo/tickets/{{e2e_id}}/cierre"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "motivo_cierre": "Prueba E2E Bruno"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 200", () => expect(res.getStatus() === 200).to.be.true);

docs:
  content: |-
    Deja la póliza libre para QA.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
