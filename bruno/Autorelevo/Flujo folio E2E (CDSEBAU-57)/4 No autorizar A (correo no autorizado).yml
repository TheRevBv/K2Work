info:
  name: "No autorizar A (correo no autorizado)"
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/boleta-informativa/auto-relevo/tickets/{{e2e_id}}"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "boleta_informativa": {
          "fecha_autorizacion_siniestro": "2026-11-24 10:00:00",
          "tiempo_autorizacion_valuacion": 1,
          "fecha_asignacion_auto": "2026-11-24 10:00:00",
          "tiempo_asignacion": 1,
          "evaluador_aprobo_servicio": false,
          "motivo_evaluacion_servicio": "Prueba E2E: póliza sin cobertura"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("res.getStatus() === 200", () => expect(res.getStatus() === 200).to.be.true);
        test("res.getBody().data.ServicioAutoRelevo.estatus_servicio === 'No autorizado'", () => expect(res.getBody().data.ServicioAutoRelevo.estatus_servicio === 'No autorizado').to.be.true);

docs:
  content: |-
    Caso A: llega 'AUTO RELEVO - Servicio no autorizado' con el motivo a {{correo_qa}}; se libera el evento.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
