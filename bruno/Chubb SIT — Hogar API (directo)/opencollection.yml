opencollection: 1.0.0

info:
  name: "Chubb SIT "
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: chubbSitBase
      value: https://sit.latam.studiogateway.chubb.com
    - name: tokenUrl
      value: https://sit.latam.studiogateway.chubb.com/enterprise.operations.authorization
    - name: appId
      value: "{{process.env.CHUBB_SIT_APP_ID}}"
    - name: appKey
      value: "{{process.env.CHUBB_SIT_APP_KEY}}"
    - name: resource
      value: "{{process.env.CHUBB_SIT_RESOURCE}}"
    - name: accessToken
      value: ""
    - name: policyNumber
      value: CE50002194
    - name: claveId
      value: ""
    - name: url_claims
      value: ""
    - name: chubb_token
      value: ""
    - name: accessToken2
      value: ""
    - name: policyNumberS6
      value: CE50001692
    - name: chubb_sit_token
      value: ""

docs:
  content: |-
    Pruebas directas al API Gateway de Chubb SIT para pólizas Hogar.
    Usar para encontrar pólizas válidas en SIT antes de probar en K2.

    Flujo:
    1. POST Token SIT → guarda token automáticamente
    2. GET Policy Detail → buscar póliza con PolicyNumber
    3. POST Policy Validate → validar servicios disponibles
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
