docs:
  content: |-
    Pruebas directas al API Gateway de Chubb SIT para pólizas Hogar.
    Usar para encontrar pólizas válidas en SIT antes de probar en K2.

    Flujo:
    1. POST Token SIT → guarda token automáticamente
    2. GET Policy Detail → buscar póliza con PolicyNumber
    3. POST Policy Validate → validar servicios disponibles
  type: text/markdown
